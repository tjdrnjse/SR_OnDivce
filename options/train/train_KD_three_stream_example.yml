# ============================================================
# Three-Stream Knowledge Distillation Training Example
#
# Stream A-deg  : RealESRGANDataset (HQ only)
#                 -> on-the-fly 2-stage GPU degradation -> LQ
#                 Loss: KD (feat + output) + pixel vs USM-sharpened GT
#
# Stream A-bp   : RealESRGANDataset (HQ + LQ paired, probabilistic)
#                 -> prob_paired_lq 확률로 real LQ 직접 로드 (bypass)
#                 Loss: KD (feat + output) + supervised pixel vs real GT
#
# Stream B      : SingleLRDataset (LQ only)
#                 Loss: KD (feat + output) only (no pixel loss)
#
# batch 구성 비율 (per GPU, 예시 batch_size_per_gpu=16):
#   JointBatchSampler: Stream A (A-deg+A-bp 합산) vs Stream B = 50/50
#   A-deg / A-bp 비율: prob_paired_lq 로 확률적 조절
#     예) prob_paired_lq=0.3 -> 배치 내 A 샘플의 약 30%가 A-bp
#
# Note: batch는 균등하지 않아도 됩니다.
#   JointBatchSampler는 train_1(A)와 train_2(B) 사이의 비율만 보장하며
#   A 내부의 A-deg/A-bp 분할은 RealESRGANDataset의 prob_paired_lq에 맡깁니다.
# ============================================================

name: train_KD_three_stream_example
model_type: KDSRModel
scale: 4             # student 목표 upscale
num_gpu: auto
manual_seed: 0

# joint_batch_training: true 로 설정해야 JointBatchSampler 활성화
joint_batch_training: true

# ============================================================
# Dataset
# ============================================================
datasets:
  # ---- Stream A: RealESRGANDataset (A-deg + A-bp 혼합) ------
  train_1:
    name: HR_and_Paired
    type: RealESRGANDataset

    # HQ (GT) 폴더 — A-deg, A-bp 공통
    dataroot_gt: /path/to/hr_images       # <-- 실제 HR 폴더로 교체

    # Paired LQ 폴더 — A-bp 에서만 사용
    # 설정하지 않으면 모든 A 샘플이 A-deg(degradation path)로 처리됩니다.
    dataroot_lq: /path/to/paired_lr_images  # <-- 실제 LR 폴더로 교체

    # A-bp 발생 확률 [0, 1]
    #   0.0 -> 전체 A가 A-deg (bypass 비활성)
    #   0.3 -> A 샘플의 약 30%가 A-bp (supervised), 70%가 A-deg
    #   1.0 -> 전체 A가 A-bp (degradation 비활성)
    prob_paired_lq: 0.3
    scale: 4    # synchronized crop 계산에 필요 (= 루트 레벨 scale 과 동일)

    io_backend:
      type: disk

    use_hflip: true
    use_rot: true

    # Blur kernel 설정 (A-deg에서만 사용)
    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso',
                  'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3.0]
    betag_range: [0.5, 4.0]
    betap_range: [1.0, 2.0]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso',
                   'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4.0]
    betap_range2: [1.0, 2.0]
    final_sinc_prob: 0.8

    # DataLoader 설정
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16    # GPU당 total: 8 from A + 8 from B
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # ---- Stream B: SingleLRDataset (KD only) -------------------
  train_2:
    name: LR_generative
    type: SingleLRDataset
    dataroot_lq: /path/to/generative_lr_images   # <-- 실제 LR 폴더로 교체
    io_backend:
      type: disk

    # lq_patch_size = degradation.gt_size // scale
    # 예) 256 // 4 = 64
    lq_patch_size: 64
    use_hflip: true
    use_rot: true

  # ---- Validation --------------------------------------------
  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set5/GTmod4
    dataroot_lq: ./datasets/Set5/LRbicx4
    io_backend:
      type: disk

  val_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set14/GTmod4
    dataroot_lq: ./datasets/Set14/LRbicx4
    io_backend:
      type: disk

# ============================================================
# GPU-side degradation pipeline (Stream A-deg 전용)
# gt_size: HR 패치 크기 -> LQ 크기 = gt_size // teacher_upscale
# ============================================================
degradation:
  gt_size: 256

  # First degradation pass
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  # Second degradation pass
  second_blur_prob: 0.8
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

# ============================================================
# Student network (예: HAT-Small x4)
# ============================================================
network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Teacher network (예: HAT-Large x4, frozen)
# ============================================================
network_teacher:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Path
# ============================================================
path:
  pretrain_network_g: ~                                     # student warm-start (선택)
  strict_load_g: false
  resume_state: ~
  pretrain_network_teacher: /path/to/teacher.pth            # REQUIRED

# ============================================================
# Training
# ============================================================
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [200000, 300000, 350000, 375000]
    gamma: 0.5

  total_iter: 400000
  warmup_iter: -1

  # ---- Loss 설정 -----------------------------------------------
  # pixel_opt: A-deg (vs USM-GT) 및 A-bp (vs paired GT) 에 적용됩니다.
  #            Stream B는 GT가 없으므로 pixel loss 없음.
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  # Feature-level KD (FitNet MSE) - 모든 stream에 적용
  kd_feat_opt:
    loss_weight: 0.1

  # Output-level KD (L1 vs teacher pseudo-GT) - 모든 stream에 적용
  kd_output_opt:
    loss_weight: 1.0

  # Feature projector channel 설정 (kd_feat_opt 사용 시 필수)
  student_feat_channels: 64
  teacher_feat_channels: 64

# ============================================================
# Validation
# ============================================================
val:
  val_freq: !!float 5e3
  save_img: true
  save_img_num: 4
  pbar: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
      better: higher

# ============================================================
# Logging
# ============================================================
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  tb_train_vis_freq: 500
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
