# ============================================================
# Knowledge Distillation SR Training
#   Student : HAT-Small (x3, embed_dim=144, 6-stage)
#   Teacher : HAT-Base  (x4, embed_dim=180, GAN Real SRx4 pretrained, frozen)
#   Scale   : x3  (student target)
#
# Cross-Scale KD: teacher x4 → pseudo_GT bicubic-downsampled to x3
# Feature KD:     both teacher/student conv_before_upsample → 64ch
# ============================================================

# ── General ──────────────────────────────────────────────────
name: train_KD_HAT_S_x3_from_HAT_GAN_x4
model_type: KDSRModel
scale: 3          # student target scale
num_gpu: auto
manual_seed: 0

# ============================================================
# Dataset
#   SingleLRDataset: loads real LR images at native resolution.
#   No HR ground-truth needed — teacher generates Pseudo-GT.
#   lq_patch_size=64 → student output 192x192, teacher 256x256→192x192
# ============================================================
datasets:
  train:
    name: LR_train
    type: SingleLRDataset
    dataroot_lq: /path/to/dummy/lr_images    # <-- replace with real LR folder
    io_backend:
      type: disk

    lq_patch_size: 64    # random-crop size in LR space (no resize)
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set5/GTmod3
    dataroot_lq: ./datasets/Set5/LRbicx3
    io_backend:
      type: disk

  val_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set14/GTmod3
    dataroot_lq: ./datasets/Set14/LRbicx3
    io_backend:
      type: disk

# ============================================================
# Student network: HAT-Small x3
#   Official HAT-S spec (6-stage, embed_dim=144)
#   conv_before_upsample outputs 64ch → student_feat_channels: 64
# ============================================================
network_g:
  type: HAT
  upscale: 3
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Teacher network: HAT-Base x4 (Real_HAT_GAN_SRx4 weights)
#   conv_before_upsample outputs 64ch → teacher_feat_channels: 64
#   Frozen throughout training.
# ============================================================
network_teacher:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Path settings
# ============================================================
path:
  # Student: warm-start from HAT-S ImageNet x3 pretrained
  pretrain_network_g: /path/to/dummy/HAT-S_SRx3_ImageNet-pretrain.pth
  strict_load_g: false    # allow partial loading (e.g. head mismatch)
  resume_state: ~

  # Teacher: REQUIRED – HAT GAN Real SRx4 pretrained checkpoint
  pretrain_network_teacher: /path/to/dummy/HAT_GAN_Real_SRx4.pth

# ============================================================
# Training settings
# ============================================================
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [200000, 300000, 350000, 375000]
    gamma: 0.5

  total_iter: 400000
  warmup_iter: -1

  # ── KD loss mode (set loss_weight: 0.0 or omit a block to disable it) ──
  #   Output-only  → keep kd_output_opt, remove/zero kd_feat_opt
  #   Feature-only → keep kd_feat_opt,   remove/zero kd_output_opt
  #   Both         → keep both (current setting)

  # Feature-level KD (FitNet MSE)
  # Low weight to avoid over-fitting to GAN teacher's sharp texture artifacts
  kd_feat_opt:
    loss_weight: 0.1

  # Output-level KD (L1 vs teacher pseudo-GT)
  # Teacher pseudo-GT is bicubic-downsampled from x4 to x3 resolution
  kd_output_opt:
    loss_weight: 1.0

  # ── Supervised pixel loss disabled (no HR GT in SingleLRDataset) ──
  # pixel_opt:
  #   type: L1Loss
  #   loss_weight: 0.5
  #   reduction: mean

  # ── Feature channel dims ────────────────────────────────────
  # Both teacher and student HAT variants use conv_before_upsample
  # which always outputs 64 channels (num_feat hardcoded in HAT).
  student_feat_channels: 64
  teacher_feat_channels: 64

# ============================================================
# Validation settings
# ============================================================
val:
  val_freq: !!float 5e3
  save_img: true
  save_img_num: 4
  pbar: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 3
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 3
      test_y_channel: true
      better: higher

# ============================================================
# Logging settings
# ============================================================
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  tb_train_vis_freq: 500
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
