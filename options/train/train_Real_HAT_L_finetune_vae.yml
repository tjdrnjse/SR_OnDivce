# ============================================================
# Teacher Fine-tuning: HAT-L (Real-SR MSE) + VAE Artifact Removal
#
# Objective:
#   Maintain HAT-L general SR quality while improving performance
#   on LQ images with generative model VAE artifacts.
#
# Dataset strategy (probabilistic degradation branch):
#   - With prob (1 - prob_paired_lq): standard RealESRGAN synthetic
#     degradation pipeline (blur + noise + JPEG) is applied on the
#     fly in the model's feed_data (GPU-side synthesis).
#   - With prob prob_paired_lq: the paired real LQ image is loaded
#     directly from dataroot_lq, bypassing all degradation steps.
#     GT and LQ are jointly augmented and cropped, then passed to
#     the model as a supervised paired training example.
#
# Key constraint:
#   lq_patch_size ≈ gt_size // scale  (dataset delivers 400-pad GT
#   and 100-pad LQ; model's paired_random_crop further crops to
#   gt_size=256 / lq_size=64 at training time).
# ============================================================

name: train_Real_HAT_L_finetune_vae
model_type: RealHATMSEModel
scale: 4
num_gpu: auto
manual_seed: 0

# ── Global degradation pipeline parameters (used by RealHATMSEModel.feed_data)
gt_usm: true

# first degradation
resize_prob: [0.2, 0.7, 0.1]
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 95]

# second degradation
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

gt_size: 256      # HR patch size for paired_random_crop in feed_data
queue_size: 160   # must be divisible by batch_size_per_gpu × num_gpu

# ============================================================
# Dataset
# ============================================================
datasets:
  train:
    name: HAT_finetune_vae
    type: RealESRGANDataset

    # ── Stream A: HR images for synthetic degradation ─────────────────────
    dataroot_gt: /path/to/hr_images   # <-- replace with real HR folder

    # ── Stream B: paired real VAE-artifact LQ images (bypass path) ────────
    # When prob_paired_lq fires, the dataset reads a real LQ from this
    # folder instead of synthesizing one on the fly.
    # GT and LQ are spatially aligned at scale 4:
    #   GT images  ~480×480  →  padded/cropped to 400×400
    #   LQ images  ~120×120  →  padded/cropped to 100×100 (synchronized)
    # feed_data then further crops to 256×256 / 64×64 via paired_random_crop.
    dataroot_lq: /path/to/real_vae_lr_images   # <-- replace

    # prob=0.3 → 30 % of samples per epoch use supervised paired LQ,
    #            70 % use synthetic RealESRGAN degradation
    prob_paired_lq: 0.3

    # scale MUST match the top-level scale key (used for GT/LQ crop sync)
    scale: 4

    meta_info: ~   # set to a meta_info .txt to restrict GT image list
    io_backend:
      type: disk

    # ── Blur kernel settings (CPU-side, used in __getitem__) ──────────────
    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso',
                  'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso',
                   'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]
    final_sinc_prob: 0.8

    gt_size: 256
    use_hflip: true
    use_rot: false

    # DataLoader
    use_shuffle: true
    num_worker_per_gpu: 5
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # ── Validation ─────────────────────────────────────────────────────────
  # val:
  #   name: validation
  #   type: SingleImageDataset
  #   dataroot_lq: datasets/RealSRSet
  #   io_backend:
  #     type: disk

# ============================================================
# Network: HAT-L (teacher model)
# ============================================================
network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Paths
# ============================================================
path:
  pretrain_network_g: /path/to/Real_HAT_GAN_SRx4.pth   # <-- start from pretrained
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# ============================================================
# Training
# ============================================================
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 5e-5    # lower LR for fine-tuning
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [100000, 150000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# ============================================================
# Logging
# ============================================================
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
