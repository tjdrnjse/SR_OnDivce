# ============================================================
# Test / Inference: RepSR Student (KD-trained), Scale x4
# ============================================================

name: test_KD_RepSR_x4
model_type: KDSRModel
scale: 4
num_gpu: 1   # set 0 for CPU mode
manual_seed: 0

# ============================================================
# Tile settings (uncomment for GPU-memory-limited inference)
#   tile_size: spatial size of each tile (pixels)
#   tile_pad:  overlap padding to avoid boundary artefacts
# ============================================================
# tile:
#   tile_size: 256
#   tile_pad: 32

# ============================================================
# Test datasets
# ============================================================
datasets:
  test_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set5/GTmod4
    dataroot_lq: ./datasets/Set5/LRbicx4
    io_backend:
      type: disk

  test_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set14/GTmod4
    dataroot_lq: ./datasets/Set14/LRbicx4
    io_backend:
      type: disk

  # test_3:
  #   name: Urban100
  #   type: PairedImageDataset
  #   dataroot_gt: ./datasets/urban100/GTmod4
  #   dataroot_lq: ./datasets/urban100/LRbicx4
  #   io_backend:
  #     type: disk

# ============================================================
# Student network (RepSR) — must match training config exactly
# ============================================================
network_g:
  type: RepSR
  num_in_ch: 3
  num_feat: 64
  num_blocks: 8
  upscale: 4
  use_space_to_depth: false
  s2d_factor: 2

# ============================================================
# Teacher network — still required by KDSRModel at init time.
# During test only the student is used for inference;
# the teacher is loaded but kept frozen.
# If no teacher checkpoint is available, set
#   pretrain_network_teacher: ~ and strict_load_teacher: false
# ============================================================
network_teacher:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ============================================================
# Path settings
# ============================================================
path:
  # Student model checkpoint (KD-trained or reparameterized)
  pretrain_network_g: ./experiments/train_KD_RepSR_x4/models/net_g_latest.pth
  strict_load_g: true
  param_key_g: params_ema    # use 'params_ema' for EMA weights (recommended)

  # Teacher checkpoint (needed for KDSRModel init; inference only uses student)
  pretrain_network_teacher: ./experiments/pretrained_models/HAT_SRx4_ImageNet-pretrain.pth

# ============================================================
# Validation / test settings
# ============================================================
val:
  save_img: true
  suffix: ~     # suffix appended to saved image filenames; ~ = use exp name

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
