# ============================================================
# Teacher Standalone Inference: MambaIRv2 Small SR x3
# ============================================================
# Prerequisites:
#   pip install mamba-ssm einops
#   (requires CUDA-capable GPU + matching CUDA toolkit)
#
# Usage:
#   python scripts/inference_teacher_tiling.py \
#       --opt   options/inference/teacher_mambairv2_small_x3.yml \
#       --input datasets/my_lr_images \
#       --output results/teacher_mambairv2_small_x3
# ============================================================

# ---- SR scale -----------------------------------------------
scale: 3

# ---- Tiling settings ----------------------------------------
tile_size: 256       # LR tile spatial size fed to the model
tile_overlap: 32     # LR-space overlap between tiles
                     # HR crop per side = (tile_overlap * scale) // 2 = 48 px
tile_batch_size: 16  # tiles forwarded per model call (increase on high-VRAM GPUs)

# ---- I/O (can be overridden via CLI --input / --output) -----
input_dir:  datasets/my_lr_images
output_dir: results/teacher_mambairv2_small_x3
device:     cuda   # cuda | cpu
use_bf16:   false  # true = BF16 autocast (CUDA only, requires Ampere+ GPU)

# ---- Teacher network (MambaIRv2 Small x3) -------------------
# Reference: https://github.com/csguoh/MambaIR
# "Small" config: embed_dim=60, 4-stage, depths=[6,6,6,6]
network_t:
  type: MambaIRv2
  upscale: 3
  img_size: 64
  in_chans: 3
  embed_dim: 60
  d_state: 8
  depths: [6, 6, 6, 6]
  num_heads: [4, 4, 4, 4]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 2.
  img_range: 1.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ---- Teacher checkpoint -------------------------------------
path:
  pretrain_network_t: experiments/pretrained_models/MambaIRv2_Small_SRx3.pth
